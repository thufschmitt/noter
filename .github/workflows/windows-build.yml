name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Portable checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Claude service and reply parser
        run: dotnet run --project tools/CoreCheck/CoreCheck.csproj
      - name: Windows Runtime helpers
        run: dotnet build tools/WinRtCheck/WinRtCheck.csproj

  web:
    name: Web version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server, over a real WebSocket
        run: dotnet run --project tools/WebCheck/WebCheck.csproj
      - name: Page, in Chrome
        run: tools/BrowserCheck/run.sh google-chrome "$RUNNER_TEMP/browser-check"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/browser-check
          if-no-files-found: ignore

  version:
    name: Version number
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # Major and minor come from Package.appxmanifest; the build number is this workflow's run number,
        # so every build is newer than the one before and installs over it.
        run: |
          base=$(grep -oP '<Identity [^>]*Version="\K[0-9]+\.[0-9]+' Longhand/Package.appxmanifest)
          echo "version=$base.${{ github.run_number }}.0" >> "$GITHUB_OUTPUT"

  app:
    name: UWP app (${{ matrix.platform }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2

      - name: Stamp the version
        shell: pwsh
        run: |
          $manifest = "Longhand/Package.appxmanifest"
          $xml = Get-Content $manifest -Raw
          $xml = $xml -replace '(<Identity [^>]*Version=")[^"]+(")', "`${1}${{ needs.version.outputs.version }}`${2}"
          Set-Content $manifest $xml -NoNewline
          Select-String -Path $manifest -Pattern '<Identity'

      - name: Load the signing certificate
        id: cert
        # Windows PowerShell, for the certificate cmdlets. The subject must match the Publisher in Package.appxmanifest.
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.LONGHAND_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.LONGHAND_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { throw "Add the LONGHAND_PFX_BASE64 and LONGHAND_PFX_PASSWORD repository secrets." }
          $pfx = Join-Path $env:RUNNER_TEMP "longhand.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          Add-Content -Path $env:GITHUB_OUTPUT -Value "thumbprint=$($cert.Thumbprint)" -Encoding ascii
          New-Item -ItemType Directory -Force AppPackages | Out-Null
          Export-Certificate -Cert $cert -FilePath AppPackages\Longhand.cer | Out-Null

      - name: Build and sign
        # Visual Studio's MSBuild carries the UWP XAML compiler and packaging targets.
        run: >
          msbuild Longhand/Longhand.csproj -restore -nologo -v:minimal
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxBundle=Never
          -p:AppxPackageDir=${{ github.workspace }}\AppPackages\

      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: Longhand-${{ matrix.platform }}
          path: AppPackages/
          if-no-files-found: error

  release:
    name: GitHub release
    # Every push to main becomes a release; other branches and pull requests only keep build artifacts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, version, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Longhand-*
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir upload
          find dist -name '*.msix' -exec cp {} upload/ \;
          # The framework packages each build depends on (WinUI 2), named by architecture since they share a file name.
          for arch in x64 arm64; do
            find dist -ipath "*/Dependencies/$arch/*.appx" | while read -r dep; do
              cp "$dep" "upload/$(basename "${dep%.appx}")_$arch.appx"
            done
          done
          cp "$(find dist -name Longhand.cer | head -1)" upload/Longhand.cer
          ls -l upload
          gh release create "v$VERSION" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Longhand $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Install: trust Longhand.cer once (certutil -addstore TrustedPeople Longhand.cer, as administrator), then open the .msix for your PC (x64 or arm64)."

  pages:
    name: Update feed
    # Serves the .appinstaller files from GitHub Pages, pointing at the packages on the Release, so installed copies update
    # themselves. It waits for the Release so a feed never names packages that aren't there yet.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, version, app, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Longhand-*
          path: dist
      - id: pages
        uses: actions/configure-pages@v5
      - name: Assemble the site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
        run: |
          tools/make-update-site.sh dist site "$BASE_URL" "$VERSION" "$PACKAGES_URL"
          {
            echo "### Longhand $VERSION"
            echo "- x64: $BASE_URL/Longhand-x64.appinstaller"
            echo "- ARM64: $BASE_URL/Longhand-arm64.appinstaller"
            echo "- Certificate: $BASE_URL/Longhand.cer"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
