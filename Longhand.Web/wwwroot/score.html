<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<meta name="color-scheme" content="light dark">
<title>Longhand Score</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* The page is laid out at its own width (1000) and scaled to fit the window; ink and engraving share its coordinates. */
  #page { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #engraving { position: absolute; left: 0; top: 0; color: var(--text); pointer-events: none; }
  #engraving svg { display: block; }
  #scoreInk { position: absolute; left: 0; top: 0; z-index: 3; touch-action: pan-y pinch-zoom; cursor: crosshair; }
  #scoreTitle { position: absolute; top: 28px; left: 36px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .08em; pointer-events: none; }
  #play.on { background: var(--trayline); }
</style>
</head>
<body>
<div id="scroller">
  <div id="sheet">
    <div id="page">
      <div id="scoreTitle">LONGHAND SCORE</div>
      <div id="engraving"></div>
      <canvas id="scoreInk"></canvas>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<div id="tray">
  <button id="pen" class="tool on" title="Pen" aria-label="Pen"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  <button id="eraser" class="tool" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="M20 20H9l-5-5a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3L13 19M7 11l6 6"/></svg></button>
  <button id="undo" class="tool" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M20 20v-7a4 4 0 0 0-4-4H4"/></svg></button>
  <button id="touch" class="tool" title="Write with a finger" aria-label="Write with a finger"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
  <button id="clear" class="tool" title="Clear the score (undoable)" aria-label="Clear the score"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
  <span class="sep"></span>
  <button id="play" class="accent" title="Play the score (Space)"><svg id="playIcon" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg><span id="playLabel">Play</span></button>
</div>

<audio id="audio" preload="none"></audio>
<script src="/score.js"></script>
</body>
</html>
